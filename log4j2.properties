# log4j.properties for Spark applications

# Set everything to FATAL to suppress stack traces
log4j.rootCategory=FATAL, console
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# Suppress all Spark internal logging
log4j.logger.org.apache.spark=FATAL
log4j.logger.org.spark_project=FATAL
log4j.logger.org.apache.hadoop=FATAL
log4j.logger.org.apache.parquet=FATAL
log4j.logger.parquet=FATAL

# Suppress Py4J Java Gateway
log4j.logger.py4j=FATAL

# Suppress Akka
log4j.logger.akka=FATAL

# Suppress Jetty
log4j.logger.org.sparkproject.jetty=FATAL
log4j.logger.org.sparkproject.jetty.util.component.AbstractLifeCycle=FATAL

# Suppress file system logging
log4j.logger.org.apache.hadoop.util.NativeCodeLoader=FATAL
log4j.logger.org.apache.hadoop.metrics2=FATAL

# Settings to quiet third party logs that are too verbose
log4j.logger.org.eclipse.jetty=FATAL
log4j.logger.org.apache.spark.repl.Main=FATAL
log4j.logger.org.apache.spark.repl.SparkIMain$exprTyper=FATAL
log4j.logger.org.apache.spark.repl.SparkILoop$SparkILoopInterpreter=FATAL
