x-etl-base: &etl-base
  build: .
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: ${DB_NAME:-healthai_db}
    DB_USER: ${DB_USER:-healthai}
    DB_PASSWORD: ${DB_PASSWORD:-password}
    SPARK_MASTER: local[*]
    KAGGLE_USERNAME: ${KAGGLE_USERNAME}
    KAGGLE_KEY: ${KAGGLE_API_TOKEN}
  volumes:
    - ./data:/app/data
    - ./logs:/app/logs
  networks:
    - healthai_network

services:
  postgres:
    image: postgres:15-alpine
    container_name: healthai_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-healthai_db}
      POSTGRES_USER: ${DB_USER:-healthai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_initdb.sql:/docker-entrypoint-initdb.d/01_initdb.sql
    networks:
      - healthai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthai -d healthai_db && psql -U healthai -d healthai_db -c 'SELECT 1 FROM role LIMIT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ETL services 
  # Run all pipelines:       docker-compose run --rm etl
  # Run a single pipeline:   docker-compose run --rm etl-exercises
  etl:
    <<: *etl-base
    container_name: healthai_etl
    command: python3 main.py

  etl-exercises:
    <<: *etl-base
    container_name: healthai_etl_exercises
    command: python3 main.py exercises

  etl-nutrition:
    <<: *etl-base
    container_name: healthai_etl_nutrition
    command: python3 main.py nutrition

  etl-nutrition-values:
    <<: *etl-base
    container_name: healthai_etl_nutrition_values
    command: python3 main.py nutrition_values

volumes:
  postgres_data:

networks:
  healthai_network:
    driver: bridge
